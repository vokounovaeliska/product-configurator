name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository'

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compile project
        working-directory: ./backend
        run: ./mvnw --batch-mode --quiet compile -Dskip.flyway.migration=true -Dskip.jooq.generation=true

  ktlint:
    name: ktlint Check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run ktlint
        working-directory: ./backend
        run: ./mvnw --batch-mode --quiet ktlint:check

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-22.04
    needs: compile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run unit tests
        working-directory: ./backend
        run: ./mvnw --batch-mode --quiet test -Dskip.flyway.migration=true -Dskip.jooq.generation=true

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-22.04
    needs: compile
    services:
      docker:
        image: docker:20-dind
        options: --privileged
    env:
      DOCKER_HOST: tcp://localhost:2375
      DOCKER_TLS_CERTDIR: ""
      DOCKER_DRIVER: overlay2
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run integration tests
        working-directory: ./backend
        run: ./mvnw --no-transfer-progress --batch-mode --quiet verify -Dskip.flyway.migration=true -Dskip.jooq.generation=true -DskipUTs

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: '**/target/test-logs/integration-test.log'
          retention-days: 1

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.6.5'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Remove Railway-specific files (not needed for CI)
        run: |
          rm -f frontend/package.json frontend/pnpm-lock.yaml frontend/turbo.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend apps
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_BE_URL: http://localhost:8080
          NEXT_PUBLIC_REST_API_URL: http://localhost:8080
          ENV_NAME: local
        run: pnpm turbo build --filter=nextjs --filter=storybook --output-logs=errors-only

      - name: Type check frontend
        run: pnpm turbo type-check --filter=nextjs --filter=storybook --output-logs=errors-only

      - name: Lint check frontend
        run: pnpm turbo lint:check --filter=nextjs --filter=storybook --output-logs=errors-only

