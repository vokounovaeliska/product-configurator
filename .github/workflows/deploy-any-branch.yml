name: Deploy any branch to Railway and Supabase

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: main

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository'

jobs:
  deploy:
    name: Manual deploy from any branch
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Build Flyway connection from secrets
      # Required: SUPABASE_DB_HOST, SUPABASE_DB_USER, SUPABASE_DB_PASSWORD
      # Optional: SUPABASE_DB_PORT (defaults to 6543), SUPABASE_DB_NAME (defaults to postgres)
      - name: Set Flyway env vars
        run: |
          DB_HOST="${{ secrets.SUPABASE_DB_HOST }}"
          DB_USER="${{ secrets.SUPABASE_DB_USER }}"
          DB_PASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}"
          DB_PORT="${{ secrets.SUPABASE_DB_PORT }}"
          DB_NAME="${{ secrets.SUPABASE_DB_NAME }}"
          
          # Set defaults
          [ -z "$DB_PORT" ] && DB_PORT="6543"
          [ -z "$DB_NAME" ] && DB_NAME="postgres"
          
          # Build JDBC URL
          echo "FLYWAY_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&pgbouncer=true" >> "$GITHUB_ENV"
          echo "FLYWAY_USER=${DB_USER}" >> "$GITHUB_ENV"
          echo "FLYWAY_PASSWORD=${DB_PASSWORD}" >> "$GITHUB_ENV"

      - name: Run Supabase migrations
        working-directory: ./backend
        run: |
          ./mvnw --batch-mode --quiet flyway:migrate \
            -Dflyway.url="${FLYWAY_URL}" \
            -Dflyway.user="${FLYWAY_USER}" \
            -Dflyway.password="${FLYWAY_PASSWORD}" \
            -Dflyway.connectRetries=15 \
            -Dflyway.connectRetriesInterval=5 \
            -Dskip.jooq.generation=true

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh > /dev/null 2>&1
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: ./backend
        run: |
          railway login --token "$RAILWAY_TOKEN" > /dev/null 2>&1
          railway up --quiet

      - name: Deploy frontend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: ./frontend
        run: |
          railway login --token "$RAILWAY_TOKEN" > /dev/null 2>&1
          railway up --service nextjs --quiet

