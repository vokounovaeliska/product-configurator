name: Deploy any branch to Railway and Supabase

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: main

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository'

jobs:
  deploy:
    name: Manual deploy from any branch
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set Flyway env vars
        run: |
          echo "FLYWAY_URL=jdbc:postgresql://${{ secrets.SUPABASE_DB_HOST }}:${{ secrets.SUPABASE_DB_PORT }}/${{ secrets.SUPABASE_DB_NAME }}?sslmode=require" >> "$GITHUB_ENV"
          echo "FLYWAY_USER=${{ secrets.SUPABASE_DB_USER }}" >> "$GITHUB_ENV"
          echo "FLYWAY_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Run Supabase migrations
        working-directory: ./backend
        run: |
          ./mvnw --batch-mode --quiet flyway:migrate \
            -Dflyway.url="${FLYWAY_URL}" \
            -Dflyway.user="${FLYWAY_USER}" \
            -Dflyway.password="${FLYWAY_PASSWORD}" \
            -Dflyway.connectRetries=15 \
            -Dflyway.connectRetriesInterval=5 \
            -Dskip.jooq.generation=true

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh > /dev/null 2>&1
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Sync backend email vars to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
        run: |
          railway login --token "$RAILWAY_TOKEN" > /dev/null 2>&1

          set_backend_variable_if_present() {
            local key="$1"
            local value="$2"

            if [ -n "$value" ]; then
              railway variable set "${key}=${value}" \
                --service backend \
                --environment production \
                --skip-deploys
            fi
          }

          set_backend_variable_if_present "SPRING_MAIL_HOST" "$SPRING_MAIL_HOST"
          set_backend_variable_if_present "SPRING_MAIL_PORT" "$SPRING_MAIL_PORT"
          set_backend_variable_if_present "SPRING_MAIL_USERNAME" "$SPRING_MAIL_USERNAME"
          set_backend_variable_if_present "SPRING_MAIL_PASSWORD" "$SPRING_MAIL_PASSWORD"
          set_backend_variable_if_present "MAIL_FROM" "$MAIL_FROM"
          set_backend_variable_if_present "MAIL_FROM_NAME" "$MAIL_FROM_NAME"

      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: ./backend
        run: |
          railway login --token "$RAILWAY_TOKEN" > /dev/null 2>&1
          railway up --quiet

      - name: Deploy frontend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: ./frontend
        run: |
          railway login --token "$RAILWAY_TOKEN" > /dev/null 2>&1
          railway up --service nextjs --quiet

