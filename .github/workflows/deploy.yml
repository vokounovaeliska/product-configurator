name: Deploy to Railway and Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository'

jobs:
  deploy:
    name: Deploy to Railway and Run Supabase Migrations
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Build Flyway URL from separate secrets
      # Use connection pooler (port 6543) for better reliability with external connections
      # User format should be: postgres.tenant-id (e.g., postgres.memhwmoymcinxuvcthfz)
      # Host should be pooler host: aws-X-region.pooler.supabase.com
      - name: Set Flyway env vars
        run: |
          DB_PORT="${{ secrets.SUPABASE_DB_PORT }}"
          if [ -z "$DB_PORT" ]; then
            DB_PORT="6543"
            echo "Using connection pooler port 6543 (transaction mode - recommended for migrations)"
          fi
          # Build JDBC URL with pgbouncer parameter for connection pooler
          echo "FLYWAY_URL=jdbc:postgresql://${{ secrets.SUPABASE_DB_HOST }}:${DB_PORT}/${{ secrets.SUPABASE_DB_NAME }}?sslmode=require&pgbouncer=true" >> "$GITHUB_ENV"
          echo "FLYWAY_USER=${{ secrets.SUPABASE_DB_USER }}" >> "$GITHUB_ENV"
          echo "FLYWAY_PASSWORD=${{ secrets.SUPABASE_DB_PASSWORD }}" >> "$GITHUB_ENV"
          echo "DB_HOST=${{ secrets.SUPABASE_DB_HOST }}" >> "$GITHUB_ENV"
          echo "DB_PORT=${DB_PORT}" >> "$GITHUB_ENV"

      # Test database connectivity before running migrations
      - name: Test database connectivity
        run: |
          echo "Testing connection to $DB_HOST:$DB_PORT..."
          # Use bash built-in /dev/tcp for connectivity test (more reliable than netcat)
          timeout 30 bash -c 'until timeout 2 bash -c "echo > /dev/tcp/$DB_HOST/$DB_PORT" 2>/dev/null; do sleep 2; done' || {
            echo "::error::Cannot reach database at $DB_HOST:$DB_PORT"
            echo "::error::Please verify:"
            echo "::error::1. Database is not paused (check Supabase dashboard)"
            echo "::error::2. Using connection pooler host: aws-X-region.pooler.supabase.com (NOT db.xxxxx.supabase.co)"
            echo "::error::3. User format includes tenant ID: postgres.tenant-id (NOT just postgres)"
            echo "::error::4. Port is 6543 for transaction mode (or 5432 for session mode)"
            echo "::error::5. Host, user, and port are correct in GitHub secrets"
            exit 1
          }
          echo "✓ Database is reachable"

      - name: Run Supabase Migrations
        working-directory: ./backend
        run: |
          ./mvnw --batch-mode --quiet flyway:migrate \
            -Dflyway.url="${FLYWAY_URL}" \
            -Dflyway.user="${FLYWAY_USER}" \
            -Dflyway.password="${FLYWAY_PASSWORD}" \
            -Dflyway.connectRetries=15 \
            -Dflyway.connectRetriesInterval=5 \
            -Dskip.jooq.generation=true

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh > /dev/null 2>&1
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Deploy Backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: ./backend
        run: |
          railway login --token "$RAILWAY_TOKEN" > /dev/null 2>&1
          railway up --quiet

      - name: Deploy Frontend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: ./frontend
        run: |
          railway login --token "$RAILWAY_TOKEN" > /dev/null 2>&1
          railway up --service nextjs --quiet