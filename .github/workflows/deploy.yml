name: Deploy to Railway and Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository'

jobs:
  deploy:
    name: Deploy to Railway and Run Supabase Migrations
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Build Flyway connection from secrets
      # Required: SUPABASE_DB_HOST, SUPABASE_DB_USER, SUPABASE_DB_PASSWORD
      # Optional: SUPABASE_DB_PORT (defaults to 6543), SUPABASE_DB_NAME (defaults to postgres)
      - name: Set Flyway env vars
        run: |
          DB_HOST="${{ secrets.SUPABASE_DB_HOST }}"
          DB_USER="${{ secrets.SUPABASE_DB_USER }}"
          DB_PASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}"
          DB_PORT="${{ secrets.SUPABASE_DB_PORT }}"
          DB_NAME="${{ secrets.SUPABASE_DB_NAME }}"
          
          # Set defaults
          [ -z "$DB_PORT" ] && DB_PORT="6543"
          [ -z "$DB_NAME" ] && DB_NAME="postgres"
          
          # Build JDBC URL - disable prepared statements for pgbouncer compatibility
          echo "FLYWAY_URL=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0" >> "$GITHUB_ENV"
          echo "FLYWAY_USER=${DB_USER}" >> "$GITHUB_ENV"
          echo "FLYWAY_PASSWORD=${DB_PASSWORD}" >> "$GITHUB_ENV"

      - name: Run Supabase Migrations
        working-directory: ./backend
        run: |
          ./mvnw --batch-mode --quiet flyway:migrate \
            -Dflyway.url="${FLYWAY_URL}" \
            -Dflyway.user="${FLYWAY_USER}" \
            -Dflyway.password="${FLYWAY_PASSWORD}" \
            -Dflyway.connectRetries=15 \
            -Dflyway.connectRetriesInterval=5 \
            -Dskip.jooq.generation=true

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Sync backend email vars to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
        run: |
          export PATH="$HOME/.railway/bin:$PATH"

          set_backend_variable_if_present() {
            local key="$1"
            local value="$2"

            if [ -n "$value" ]; then
              railway variable set "${key}=${value}" \
                --service backend \
                --environment production \
                --skip-deploys
            fi
          }

          set_backend_variable_if_present "SPRING_MAIL_HOST" "$SPRING_MAIL_HOST"
          set_backend_variable_if_present "SPRING_MAIL_PORT" "$SPRING_MAIL_PORT"
          set_backend_variable_if_present "SPRING_MAIL_USERNAME" "$SPRING_MAIL_USERNAME"
          set_backend_variable_if_present "SPRING_MAIL_PASSWORD" "$SPRING_MAIL_PASSWORD"
          set_backend_variable_if_present "MAIL_FROM" "$MAIL_FROM"
          set_backend_variable_if_present "MAIL_FROM_NAME" "$MAIL_FROM_NAME"

      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "::group::Deploy backend to Railway"
          export PATH="$HOME/.railway/bin:$PATH"
          railway up -s backend -e production
          echo "::endgroup::"

      - name: Deploy frontend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "::group::Deploy frontend to Railway"
          export PATH="$HOME/.railway/bin:$PATH"
          railway up -s nextjs -e production
          echo "::endgroup::"
