name: Deploy to Railway and Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Dmaven.repo.local=.m2/repository'

jobs:
  deploy:
    name: Deploy to Railway and Run Supabase Migrations
    runs-on: ubuntu-22.04
    # Allow deployment from main branch or manual workflow dispatch from any branch
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Build Flyway JDBC URL directly from Supabase URL
      - name: Set Flyway env from Supabase URL
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          # SUPABASE_DATABASE_URL example:
          # postgresql://postgres:YOUR_PASSWORD@db.memhwmoymcinxuvcthfz.supabase.co:5432/postgres
          DB_URL="${SUPABASE_DATABASE_URL}"
          echo "Using Supabase DB URL (masked in logs)"
          # Build JDBC URL with SSL required
          echo "FLYWAY_URL=jdbc:${DB_URL}?sslmode=require" >> "$GITHUB_ENV"

      - name: Run Supabase Migrations
        working-directory: ./backend
        run: |
          ./mvnw --batch-mode --quiet flyway:migrate \
            -Dflyway.url="${FLYWAY_URL}" \
            -Dskip.jooq.generation=true

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh > /dev/null 2>&1
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Deploy Backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: ./backend
        run: |
          railway login --token "$RAILWAY_TOKEN" > /dev/null 2>&1
          railway up --quiet

      - name: Deploy Frontend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: ./frontend
        run: |
          railway login --token "$RAILWAY_TOKEN" > /dev/null 2>&1
          railway up --service nextjs --quiet