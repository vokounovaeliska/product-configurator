app:
  files:
    upload-dir: ${UPLOAD_DIR:/data/uploads/images}
  # Sender identity (your domain). Base values in application.yaml; override in prod:
  # mail:
  #   from-address: ${MAIL_FROM}   # e.g. noreply@yourdomain.com
  #   from-name: ${MAIL_FROM_NAME} # e.g. "Your Company Configurator"

jwt:
  users:
    key: ${JWT_USERS_KEY}
    access-token-expiration-in-minutes: 10
    refresh-token-expiration-in-minutes: 1440  # 1 day (24 * 60)

cors:
  # Must include frontend origin(s) when using credentials (cookies). Override via CORS_ALLOWED_ORIGINS.
  allowed-origins: >
    ${CORS_ALLOWED_ORIGINS:https://konfiguruj.com,https://www.konfiguruj.com}

# Email (SMTP). Set these env vars in Railway to send real emails:
#   SPRING_MAIL_HOST=mail.webglobe.cz
#   SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=info@konfiguruj.com
#   SPRING_MAIL_PASSWORD=<mailbox-password>
#   MAIL_FROM=noreply@konfiguruj.com
#   MAIL_FROM_NAME=Konfiguruj
# Without SPRING_MAIL_HOST, emails are logged only (noop).
# SMTP auth and STARTTLS are required for Webglobe (port 587).
spring:
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${SPRING_MAIL_SSL_ENABLE:true}
      mail.smtp.starttls.enable: ${SPRING_MAIL_STARTTLS_ENABLE:false}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    # Application code: use LOG_LEVEL_APP=DEBUG in Railway to see request/response and business logs
    cz.vokounova.configurator: ${LOG_LEVEL_APP:INFO}
    # Reduce framework noise in production
    org.springframework.web: WARN
    org.springframework.boot: WARN
    org.springframework.jdbc: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    org.apache.tomcat: WARN
    org.eclipse.jetty: WARN
