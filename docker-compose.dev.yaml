version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: configurator-db-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-configuratordb}
      POSTGRES_USER: ${POSTGRES_USER:-configuratoruser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-configuratorpassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-configuratoruser}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data-dev:
    driver: local

