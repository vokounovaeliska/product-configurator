version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: configurator-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-configurator}
      POSTGRES_USER: ${POSTGRES_USER:-configurator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-configurator_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-configurator}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - configurator-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: configurator-backend
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-configurator}
      DB_USERNAME: ${POSTGRES_USER:-configurator}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-configurator_password}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - configurator-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  configurator-network:
    driver: bridge

